name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall app.py src tests

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Benchmark XGBoost candidates
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import pandas as pd
          from imblearn.combine import SMOTETomek
          from sklearn.metrics import accuracy_score, f1_score, precision_score, recall_score
          from sklearn.model_selection import train_test_split
          from sklearn.preprocessing import RobustScaler
          from xgboost import XGBClassifier
          from src.model import _clean_and_encode

          data = pd.read_csv("loan_data.csv")
          y = data["loan_status"].astype(int)
          raw_x = data.drop(columns=["loan_status"])
          x_train_raw, x_test_raw, y_train_raw, y_test_raw = train_test_split(
              raw_x, y, test_size=0.20, random_state=42, stratify=y
          )
          x_train, bounds = _clean_and_encode(x_train_raw)
          x_test, _ = _clean_and_encode(x_test_raw, bounds)
          y_train = y_train_raw.loc[x_train.index]
          y_test = y_test_raw.loc[x_test.index]
          columns = x_train.columns.tolist()
          x_test = x_test.reindex(columns=columns, fill_value=0)

          scaler = RobustScaler()
          x_train = scaler.fit_transform(x_train)
          x_test = scaler.transform(x_test)
          x_train, y_train = SMOTETomek(random_state=42).fit_resample(x_train, y_train)

          candidates = [
              ("current", dict(n_estimators=600, max_depth=5, learning_rate=0.05, subsample=0.90, colsample_bytree=0.90, min_child_weight=2, gamma=0.05, reg_alpha=0.05, reg_lambda=2.0)),
              ("balanced_4", dict(n_estimators=800, max_depth=4, learning_rate=0.04, subsample=0.95, colsample_bytree=0.95, min_child_weight=1, gamma=0.0, reg_alpha=0.0, reg_lambda=1.5)),
              ("balanced_5", dict(n_estimators=800, max_depth=5, learning_rate=0.04, subsample=0.95, colsample_bytree=0.95, min_child_weight=1, gamma=0.0, reg_alpha=0.0, reg_lambda=1.5)),
              ("regularized_5", dict(n_estimators=900, max_depth=5, learning_rate=0.035, subsample=0.95, colsample_bytree=0.90, min_child_weight=1, gamma=0.0, reg_alpha=0.02, reg_lambda=1.0)),
              ("deeper_5", dict(n_estimators=700, max_depth=6, learning_rate=0.045, subsample=0.92, colsample_bytree=0.92, min_child_weight=2, gamma=0.0, reg_alpha=0.0, reg_lambda=1.5)),
              ("conservative", dict(n_estimators=1000, max_depth=4, learning_rate=0.03, subsample=1.0, colsample_bytree=0.95, min_child_weight=1, gamma=0.0, reg_alpha=0.0, reg_lambda=1.0)),
          ]

          print("\nXGBOOST CANDIDATE BENCHMARK")
          print("=" * 78)
          results = []
          for name, params in candidates:
              model = XGBClassifier(
                  **params,
                  random_state=42,
                  eval_metric="logloss",
                  tree_method="hist",
                  n_jobs=2,
              )
              model.fit(x_train, y_train)
              pred = model.predict(x_test).astype(int)
              row = {
                  "name": name,
                  "accuracy": accuracy_score(y_test, pred),
                  "precision": precision_score(y_test, pred, zero_division=0),
                  "recall": recall_score(y_test, pred, zero_division=0),
                  "f1": f1_score(y_test, pred, zero_division=0),
              }
              results.append(row)
              print(f"{name:16s} accuracy={row['accuracy']*100:.2f}% precision={row['precision']:.4f} recall={row['recall']:.4f} f1={row['f1']:.4f}")

          best = max(results, key=lambda r: r["accuracy"])
          print("=" * 78)
          print(f"BEST ACCURACY: {best['name']} -> {best['accuracy']*100:.2f}%")
          print("=" * 78)
          PY

      - name: Train tuned model and report metrics
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.model import train_model

          bundle, metrics = train_model("loan_data.csv")
          print("=" * 60)
          print("TUNED MODEL RESULTS")
          print("=" * 60)
          print(f"Accuracy : {metrics['accuracy'] * 100:.2f}%")
          print(f"Precision: {metrics['precision']:.4f}")
          print(f"Recall   : {metrics['recall']:.4f}")
          print(f"F1 Score : {metrics['f1']:.4f}")
          print(f"Test rows: {metrics['test_rows']}")
          print(f"Features : {metrics['feature_count']}")
          print("Confusion matrix:")
          print(metrics["confusion_matrix"])
          print("=" * 60)
          PY
