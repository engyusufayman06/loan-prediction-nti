name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall app.py src tests scripts

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Run final-model smoke benchmark
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.model import train_model

          bundle, metrics = train_model("loan_data.csv")

          assert metrics["raw_rows"] == 45000
          assert metrics["clean_rows"] == 44988
          assert metrics["train_rows"] == 35990
          assert metrics["test_rows"] == 8998
          assert metrics["train_rows_after_smote"] == 55980
          assert metrics["feature_count"] == 18

          print(f"Runtime XGBoost accuracy: {metrics['accuracy'] * 100:.2f}%")
          print(f"Runtime XGBoost F1: {metrics['f1']:.4f}")
          print(f"Confusion matrix: {metrics['confusion_matrix']}")
          PY
